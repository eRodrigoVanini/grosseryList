<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Grocery List</title>
  </head>
  <body>
    <header class="container">
      <nav>
        <a href="#" class="backBttn">
          <img src="./assets/icons/arrow-line-left.svg" alt="" id="backIcon" />
          <span>Voltar</span>
        </a>
      </nav>
      <h1>Lista de Compras</h1>
    </header>

    <main class="container">
      <form action="">
        <fieldset class="new-item">
          <legend>Itens</legend>

          <div id="input-items" class="container input-wrapper">
            <label for="newItem">Novo Item</label>
            <input
              type="text"
              name="newItem"
              id="newItem"
              placeholder="Adicione um novo item"
              required
            />
          </div>
          <div id="input-items-value" class="container input-wrapper">
            <label for="newItemValue">Valor</label>
            <input
              type="number"
              name="newItemValue"
              id="newItemValue"
              placeholder="R$ 0,00"
            />
          </div>

          <a href="#">
            <button id="add-item" class="bttn-add-item" type="submit">
              Adicionar item
            </button>
          </a>

          <ul id="items-list" class="flex-column gap-12">
            <p class="itemValue">R$ 3,50</p>
          </ul>
        </fieldset>
      </form>
    </main>

    <footer class="container">
      <div id="del-alert" class="del-alert del-alert-hidden">
        <img
          id="alert-icon"
          src="./assets/icons/warning-circle-filled.svg"
          alt=""
        />
        <p>O item foi removido da lista</p>
        <img
          id="delete-alert-icon"
          src="./assets/icons/delete-small.svg"
          alt=""
        />
      </div>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
